apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: smriti-frontend
spec:
  template:
    spec:
      serviceAccountName: SMRITI_RUNTIME_SERVICE_ACCOUNT
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/smriti/frontend:TAG
          command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: https://SMRITI_API_HOST
            - name: SMRITI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smriti-api-token
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
