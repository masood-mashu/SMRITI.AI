[project]
name = "smriti"
version = "0.1.0"
description = "Smriti - patient-owned AI health memory skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "streamlit>=1.40,<2.0",
    "langgraph>=0.2,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "requests>=2.32,<3.0",
    "google-genai>=1.0,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
