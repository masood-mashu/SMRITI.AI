[project]
name = "smriti"
version = "0.1.0"
description = "Smriti - patient-owned AI health memory skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph>=1.0.10,<2.0",
    "sqlmodel>=0.0.22,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "requests>=2.32,<3.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "cryptography>=50.0,<51.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<7.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "ruff>=0.8,<1.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
