name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://smriti:smriti@localhost:5432/smriti
      DB_AUTO_CREATE: "false"
      RATE_LIMIT_BACKEND: memory
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smriti
          POSTGRES_USER: smriti
          POSTGRES_PASSWORD: smriti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smriti -d smriti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --upgrade "pip>=26.1.2" && pip install -r requirements.lock && pip install --no-deps -e ".[dev]"
      - name: Check dependencies
        run: pip check
      - name: Apply and cycle database migrations
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - name: Confirm PostgreSQL-backed test target
        run: python -c "import os; assert os.environ['DATABASE_URL'].startswith('postgresql+psycopg://')"
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Static security scan
        run: bandit -r backend -ll
      - name: Lint
        run: ruff check backend frontend tests
      - name: Run tests
        run: pytest --cov=backend --cov-report=term-missing --cov-fail-under=75 -q
      - name: Run synthetic extraction evaluation
        run: python scripts/run_extraction_eval.py

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build container
        run: docker build --tag smriti-api:ci .
